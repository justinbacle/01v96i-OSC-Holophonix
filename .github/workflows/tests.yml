name: tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the development version; 3.13 is the previous release.
        # macOS and Windows are here to keep the cross-platform paths honest --
        # REAPER config discovery and the port lookup differ on each.
        os: [ubuntu-latest]
        python: ["3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # python-rtmidi builds from source on Linux and needs the ALSA headers;
      # macOS and Windows install from wheels.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install flake8
      # Line length comes from setup.cfg.
      - run: flake8 main.py yamaha01v96i backends midi osc tools tests
